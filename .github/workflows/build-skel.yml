name: Build libhtp_ops_skel.so

on:
  push:
    branches: [build-with-idl]
  workflow_dispatch:

jobs:
  build-skel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget unzip ninja-build

      - name: Restore SDK cache
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: /tmp/hexagon-sdk.zip
          key: hexagon-sdk-6.6.0.0

      - name: Download SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q "https://softwarecenter.qualcomm.com/api/download/software/sdks/Hexagon_SDK/Linux/Debian/6.6.0.0/Hexagon_SDK_Linux.zip" -O /tmp/hexagon-sdk.zip
          echo "Downloaded: $(ls -lh /tmp/hexagon-sdk.zip)"

      - name: Save SDK cache
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/hexagon-sdk.zip
          key: hexagon-sdk-6.6.0.0

      - name: Extract SDK
        run: |
          # Extract SDK zip (creates Hexagon_SDK/6.6.0.0/...)
          unzip -q /tmp/hexagon-sdk.zip -d /opt || true
          # Find SDK root - look in common locations
          SDK=$(find /opt -name "setup_sdk_env.source" -exec dirname {} \; 2>/dev/null | head -1)
          if [ -z "$SDK" ]; then
            echo "ERROR: SDK not found after extraction"
            exit 1
          fi
          echo "SDK=$SDK"

          # Fix QAIC: cmake references bin/qaic but only Ubuntu/qaic exists
          mkdir -p "${SDK}/ipc/fastrpc/qaic/bin"
          cp "${SDK}/ipc/fastrpc/qaic/Ubuntu/qaic" "${SDK}/ipc/fastrpc/qaic/bin/qaic"
          chmod +x "${SDK}/ipc/fastrpc/qaic/bin/qaic"

      - name: Find SDK root
        id: sdk-root
        run: |
          SDK_ROOT=$(find /opt/hexagon-sdk -maxdepth 3 -name "setup_sdk_env.source" -exec dirname {} \; 2>/dev/null | head -1)
          echo "path=$SDK_ROOT" >> $GITHUB_OUTPUT

      - name: Build libhtp_ops_skel.so
        env:
          HEXAGON_SDK_ROOT: ${{ steps.sdk-root.outputs.path }}
        run: |
          SDK=$HEXAGON_SDK_ROOT
          TOOLS=$SDK/tools/HEXAGON_Tools/19.0.07

          cmake -S . -B build_hex \
            -DCMAKE_TOOLCHAIN_FILE=$SDK/build/cmake/hexagon_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM=$(which ninja) \
            -GNinja \
            -DHEXAGON_SDK_ROOT=$SDK \
            -DHEXAGON_CMAKE_ROOT=$SDK/build/cmake \
            -DHEXAGON_TOOLS_ROOT=$TOOLS \
            -DDSP_VERSION=v75 \
            -DQURT_OS=1 \
            -DV=hexagon_toolv19_v75 \
            -DPREBUILT_LIB_DIR=hexagon_toolv19_v75 \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=$(pwd)/build_hex/ship \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$(pwd)/build_hex/ship \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY=$(pwd)/build_hex/ship

          cmake --build build_hex -j$(nproc)

          echo "=== Build results ==="
          find build_hex -name "*.so" 2>/dev/null
          ls -la build_hex/ship/ 2>/dev/null

      - name: Build libhtp_ops.so (host/Android)
        env:
          HEXAGON_SDK_ROOT: ${{ steps.sdk-root.outputs.path }}
        run: |
          SDK=$HEXAGON_SDK_ROOT

          # Download Android NDK r28b
          wget -q "https://dl.google.com/android/repository/android-ndk-r28b-linux.zip" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt
          NDK=/opt/android-ndk-r28b

          cmake -S . -B build_hlos \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DHEXAGON_SDK_ROOT=$SDK \
            -DHEXAGON_CMAKE_ROOT=$SDK/build/cmake \
            -GNinja \
            -DCMAKE_MAKE_PROGRAM=$(which ninja)

          cmake --build build_hlos -j$(nproc)

          echo "=== HLOS build results ==="
          find build_hlos -name "libhtp_ops.so" 2>/dev/null
          ls -la build_hlos/ 2>/dev/null
          find build_hlos -name "*.so" 2>/dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libhtp_ops_skel-v75
          path: |
            ${{ github.workspace }}/build_hex/ship/*.so
            ${{ github.workspace }}/build_hex/ship/*.map
            ${{ github.workspace }}/build_hlos/**/libhtp_ops.so
